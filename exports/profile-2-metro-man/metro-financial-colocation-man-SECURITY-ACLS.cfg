! =====================================================================
! NetArchitect Security Policy & Extended ACL Definitions
! Target: Layer 3 Distribution Switch / Firewall Interface ACLs
! Project: Metro Financial Colocation MAN
! =====================================================================
!
! Management Plane Protection (MPP) - Authorized Admins Only
ip access-list standard ACL_MANAGEMENT_ACCESS
 remark Permit Network Operations Center (NOC) Workstations
 permit 10.255.0.0 0.0.0.255
 permit 192.168.1.0 0.0.0.31
 deny any log
!
remark Isolation and Policy for HQ Low-Latency Trading Desk [VLAN 10]
ip access-list extended ACL_HQ_LOW-LATENCY_TRADING_DESK
 remark Allow DHCP and DNS resolution
 permit udp 172.20.0.0 0.0.0.255 any eq bootps
 permit udp 172.20.0.0 0.0.0.255 any eq domain
 permit tcp 172.20.0.0 0.0.0.255 any eq domain
 remark Allow Outbound Web Traffic (HTTP/HTTPS)
 permit tcp 172.20.0.0 0.0.0.255 any eq 80
 permit tcp 172.20.0.0 0.0.0.255 any eq 443
 remark Prevent unauthorized cross-VLAN probing
 deny ip 172.20.0.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 172.20.0.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 172.20.0.0 0.0.0.255 192.168.0.0 0.0.255.255
 remark Permit all other external internet access
 permit ip 172.20.0.0 0.0.0.255 any
 deny ip any any log
!

