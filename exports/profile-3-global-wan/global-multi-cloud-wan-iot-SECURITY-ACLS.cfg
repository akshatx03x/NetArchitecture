! =====================================================================
! NetArchitect Security Policy & Extended ACL Definitions
! Target: Layer 3 Distribution Switch / Firewall Interface ACLs
! Project: Global Multi-Cloud WAN & IoT
! =====================================================================
!
! Management Plane Protection (MPP) - Authorized Admins Only
ip access-list standard ACL_MANAGEMENT_ACCESS
 remark Permit Network Operations Center (NOC) Workstations
 permit 10.255.0.0 0.0.0.255
 permit 192.168.1.0 0.0.0.31
 deny any log
!
remark Isolation and Policy for Americas Hub & Automated Scanners [VLAN 10]
ip access-list extended ACL_AMERICAS_HUB_&_AUTOMATED_SCANNERS
 remark Allow DHCP and DNS resolution
 permit udp 10.100.0.0 0.0.3.255 any eq bootps
 permit udp 10.100.0.0 0.0.3.255 any eq domain
 permit tcp 10.100.0.0 0.0.3.255 any eq domain
 remark Allow Outbound Web Traffic (HTTP/HTTPS)
 permit tcp 10.100.0.0 0.0.3.255 any eq 80
 permit tcp 10.100.0.0 0.0.3.255 any eq 443
 remark Prevent unauthorized cross-VLAN probing
 deny ip 10.100.0.0 0.0.3.255 10.0.0.0 0.255.255.255
 deny ip 10.100.0.0 0.0.3.255 172.16.0.0 0.15.255.255
 deny ip 10.100.0.0 0.0.3.255 192.168.0.0 0.0.255.255
 remark Permit all other external internet access
 permit ip 10.100.0.0 0.0.3.255 any
 deny ip any any log
!

